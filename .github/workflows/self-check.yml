name: Self-Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dogfood:
    name: Run the action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./
        with:
          files: |
            **/*.md
            !node_modules/**
            !tests/fixtures/invalid/**
          comment-on-pr: 'true'
