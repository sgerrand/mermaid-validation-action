name: Self-Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dogfood:
    name: Run the action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          files: |
            **/*.md
            !node_modules/**
            !tests/fixtures/invalid/**
          comment-on-pr: 'true'
