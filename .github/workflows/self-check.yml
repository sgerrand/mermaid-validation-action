name: Self-Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dogfood:
    name: Run the action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: ./
        with:
          files: |
            **/*.md
            !node_modules/**
            !tests/fixtures/invalid/**
          comment-on-pr: 'true'
