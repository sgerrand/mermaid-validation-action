name: Publish

on:
  release:
    types: [released]

permissions: {}

jobs:
  build:
    name: Build and smoke-test the bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      # --ignore-scripts skips the root prepare script; installing the lefthook
      # git hooks on a runner is pointless work at best.
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build

      # This step runs the freshly built bundle and its runtime dependencies,
      # which is why this job holds no write permission and no checkout
      # credentials. Pushing happens in the bundle job, which runs no project
      # code.
      - name: Smoke-test the bundle
        run: |
          out=$(mktemp)
          summary=$(mktemp)
          env \
            "INPUT_FILES=**/*.md" \
            "INPUT_WORKING-DIRECTORY=tests/fixtures/valid" \
            "INPUT_FAIL-ON-WARNING=false" \
            "INPUT_COMMENT-ON-PR=false" \
            "INPUT_GITHUB-TOKEN=" \
            GITHUB_OUTPUT="$out" \
            GITHUB_STEP_SUMMARY="$summary" \
            node dist/index.js

      - name: Upload bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  bundle:
    name: Bundle dist/ onto the release tag
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Commit dist/ and move the release tag onto it
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ ! -s dist/index.js ]; then
            echo "::error::No dist/index.js in the bundle built for $TAG"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --force dist
          if git diff --cached --quiet; then
            echo "dist/ already committed on $TAG and identical to this build; nothing to do."
            exit 0
          fi
          git commit --no-verify --message "build: bundle dist/ for $TAG"
          git tag --force "$TAG"
          git push --force origin "refs/tags/$TAG"

  publish:
    name: Move the major version tag
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/publish-action@23f4c6f12633a2da8f44938b71fde9afec138fb4 # v0.4.0
        with:
          source-tag: ${{ github.event.release.tag_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
