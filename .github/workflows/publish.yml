name: Publish

on:
  release:
    types: [released]

permissions: {}

jobs:
  bundle:
    name: Bundle dist/ onto the release tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      # --ignore-scripts keeps the root prepare script from installing the
      # lefthook git hooks, which would reject the generated bundle below.
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build

      - name: Smoke-test the bundle
        run: |
          out=$(mktemp)
          summary=$(mktemp)
          env \
            "INPUT_FILES=**/*.md" \
            "INPUT_WORKING-DIRECTORY=tests/fixtures/valid" \
            "INPUT_FAIL-ON-WARNING=false" \
            "INPUT_COMMENT-ON-PR=false" \
            "INPUT_GITHUB-TOKEN=" \
            GITHUB_OUTPUT="$out" \
            GITHUB_STEP_SUMMARY="$summary" \
            node dist/index.js

      - name: Commit dist/ and move the release tag onto it
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ ! -s dist/index.js ]; then
            echo "::error::Build produced no dist/index.js for $TAG"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --force dist
          if git diff --cached --quiet; then
            echo "dist/ already committed on $TAG and identical to this build; nothing to do."
            exit 0
          fi
          git commit --no-verify --message "build: bundle dist/ for $TAG"
          git tag --force "$TAG"
          git push --force origin "refs/tags/$TAG"

  publish:
    name: Move the major and minor tags
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/publish-action@23f4c6f12633a2da8f44938b71fde9afec138fb4 # v0.4.0
        with:
          source-tag: ${{ github.event.release.tag_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
