# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - '*'
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # `deps` is a releasing type: see release-please-config.json. The prefix
    # cannot vary per group, and bun does not support prefix-development, so
    # development updates cut a release too.
    commit-message:
      prefix: deps
      include: scope
    groups:
      esbuild:
        patterns:
          - esbuild
      runtime:
        dependency-type: production
        patterns:
          - '*'
      dev:
        dependency-type: development
        patterns:
          - '*'
        exclude-patterns:
          - esbuild
